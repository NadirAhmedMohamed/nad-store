<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- LCP Image Optimization -->
    <link rel="preconnect" href="https://images.unsplash.com" />

    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&amp;fit=crop&amp;w=1000&amp;q=75"
      fetchpriority="high"
    />

    <!-- Brand -->
    <meta name="theme-color" content="#242424" />
    <meta name="color-scheme" content="light" />

    <!-- SEO -->
    <title>Nad Store | Shop Smarter</title>

    <meta
      name="description"
      content="Discover quality products, explore new arrivals, and enjoy a smarter online shopping experience with Nad Store."
    />

    <meta
      name="keywords"
      content="Nad Store, online shopping, electronics, fashion, lifestyle, e-commerce"
    />

    <meta name="author" content="Nad Store" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="%PUBLIC_URL%/nad-store-icon.svg"
    />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Nad Store | Shop Smarter" />

    <meta
      property="og:description"
      content="Discover more. Shop smarter. Explore quality products and exclusive collections at Nad Store."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nad Store" />
    <meta property="og:title" content="Nad Store | Shop Smarter" />
    <meta
      property="og:description"
      content="Discover more. Shop smarter. Explore quality products and exclusive collections at Nad Store."
    />
    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/nad-store-og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nad Store | Shop Smarter" />
    <meta
      name="twitter:description"
      content="Discover more. Shop smarter. Explore quality products at Nad Store."
    />
    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/nad-store-og.png"
    />

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run Nad Store. </noscript>

    <div id="root"></div>
  </body>
</html>
